plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base { archivesName = 'strafemc' }

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// The profile has no Fabric API installed and only our jar may be added to it,
	// so the few Fabric API modules we use are nested inside our jar (jar-in-jar).
	def fapi = { String m -> fabricApi.module(m, project.fabric_api_version) }
	['fabric-api-base', 'fabric-lifecycle-events-v1', 'fabric-key-mapping-api-v1', 'fabric-rendering-v1',
	 'fabric-resource-loader-v1', 'fabric-networking-api-v1', 'fabric-command-api-v2', 'fabric-creative-tab-api-v1', 'fabric-registry-sync-v0', 'fabric-screen-api-v1',
	 'fabric-model-loading-api-v1', 'fabric-renderer-api-v1', 'fabric-entity-events-v1', 'fabric-menu-api-v1', 'fabric-data-attachment-api-v1', 'fabric-loot-api-v3'].each { m ->
		implementation fapi(m)
		include fapi(m)
	}

	// MP3 decoding for the few CS2 sounds VRF extracts as MP3 (LGPL, nested unmodified)
	implementation 'javazoom:jlayer:1.0.1'
	include 'javazoom:jlayer:1.0.1'
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") { expand "version": version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 25 }
java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// Headless movement sanity check against the cached live cvars: gradlew flatGroundCheck
tasks.register('flatGroundCheck', JavaExec) {
	dependsOn 'testClasses'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'dev.strafemc.client.movement.FlatGroundCheck'
	args System.getProperty('user.home') + '/strafemc/cvars-cache.json'
}

test { failOnNoDiscoveredTests = false }

// Headless viewmodel geometry check (camera-space bounds of arms + AK): gradlew vmCheck
tasks.register('vmCheck', JavaExec) {
	dependsOn 'testClasses'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = (project.findProperty('vmMain') ?: 'dev.strafemc.client.viewmodel.VmCheck')
	if (project.hasProperty('vmArgs')) args((project.findProperty('vmArgs') as String).split(','))
}

// Our core shaders must compile (a GLSL error leaves the viewmodel invisible in game): compiled in a hidden OpenGL
// window. Fails the build on an error.
tasks.register('shaderCheck', JavaExec) {
	dependsOn 'testClasses'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'dev.strafemc.client.viewmodel.ShaderCheck'
}
tasks.named('build') { dependsOn 'shaderCheck' }

// Every weapons.vdata field the gameplay classes read must be synced by the server (weapon/GameplayKeys.java), or
// clients would silently use their own local value for it. Fails the build when one is missing.
tasks.register('checkGameplayKeys') {
	def gameplay = ['weapon/WeaponStats.java', 'weapon/Recoil.java', 'weapon/GunServer.java', 'client/ClientGameplay.java',
					'client/movement/MovementController.java', 'client/movement/SourceMovement.java']
	def root = file('src/main/java/dev/strafemc')
	inputs.files(gameplay.collect { new File(root, it) } + new File(root, 'weapon/GameplayKeys.java'))
	outputs.upToDateWhen { true }
	doLast {
		def keysSrc = new File(root, 'weapon/GameplayKeys.java').text
		def listed = (keysSrc =~ /"(m_[A-Za-z0-9_]+)"/).collect { it[1] } as Set
		def missing = []
		gameplay.each { f ->
			def src = new File(root, f).text
			(src =~ /"(m_[A-Za-z0-9_]+)"/).collect { it[1] }.unique().each { k -> if (!listed.contains(k)) missing << "${f}: ${k}" }
		}
		if (!missing.isEmpty()) throw new GradleException("vdata fields read by gameplay code but not in GameplayKeys (add to SYNCED or COSMETIC):\n  " + missing.join('\n  '))
	}
}
compileJava.dependsOn 'checkGameplayKeys'

// license notices travel with the jar (the particle code is a port of ValveResourceFormat's, MIT)
jar { from(file('../THIRD_PARTY_NOTICES.md')) }
